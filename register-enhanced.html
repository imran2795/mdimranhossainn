<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 199, 255, 0.3) 0%, transparent 50%);
            animation: backgroundMove 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, -20px) rotate(10deg); }
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.2),
                0 10px 30px rgba(102, 126, 234, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
            position: relative;
            animation: containerSlideUp 0.8s ease-out;
            transition: all 0.3s ease;
        }

        .register-container:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.25),
                0 15px 40px rgba(102, 126, 234, 0.2);
        }

        @keyframes containerSlideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            border-radius: 25px 25px 0 0;
            width: 0%;
        }

        .register-header {
            margin-bottom: 35px;
            position: relative;
        }

        .register-header::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .register-header h1 {
            color: #333;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            animation: titleFade 1s ease-out 0.3s both;
        }

        .register-header p {
            color: #666;
            font-size: 16px;
            animation: subtitleFade 1s ease-out 0.5s both;
        }

        @keyframes titleFade {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes subtitleFade {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Account Type Selection */
        .account-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .account-type {
            padding: 20px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.5);
        }

        .account-type::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .account-type:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }

        .account-type:hover::before {
            opacity: 1;
        }

        .account-type.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            transform: scale(1.02);
        }

        .account-type .icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        .account-type .title {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .account-type .desc {
            font-size: 12px;
            color: #666;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.4s ease;
            background: rgba(255, 255, 255, 0.9);
            position: relative;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 
                0 0 20px rgba(102, 126, 234, 0.3),
                0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 1);
        }

        .form-group input:focus + label,
        .form-group select:focus + label {
            color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            animation: formRowSlide 0.8s ease-out;
        }

        @keyframes formRowSlide {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .register-container {
                padding: 30px 20px;
                max-width: 400px;
            }
        }

        .register-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .register-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .register-btn:hover::before {
            left: 100%;
        }

        .register-btn:active {
            transform: translateY(-1px);
        }

        .login-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .login-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .login-link:hover {
            color: #764ba2;
            transform: translateX(5px);
        }

        .login-link:hover::after {
            width: 100%;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #999;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
            border-radius: 1px;
        }

        .divider span {
            padding: 0 20px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.9);
        }

        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .alert::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .alert.show {
            opacity: 1;
            transform: translateY(0);
        }

        .alert.show::before {
            left: 100%;
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05));
            color: #059669;
            border: 2px solid rgba(34, 197, 94, 0.3);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.1);
        }

        .alert-error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            color: #dc2626;
            border: 2px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.1);
        }

        .skills-section {
            margin-bottom: 30px;
        }

        .skills-input {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .skills-input input {
            flex: 1;
        }

        .add-skill-btn {
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .add-skill-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
        }

        .add-skill-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .add-skill-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            min-height: 40px;
        }

        .skill-tag {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(102, 126, 234, 0.05));
            color: #667eea;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
            animation: skillAppear 0.4s ease-out;
        }

        @keyframes skillAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .skill-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(102, 126, 234, 0.08));
        }

        .skill-remove {
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }

        .skill-remove:hover {
            background: #dc2626;
            color: white;
            transform: scale(1.2);
        }

        /* Social Login Options */
        .social-login {
            margin-top: 20px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            color: #666;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .social-btn:hover {
            border-color: #667eea;
            background: #f8f9fa;
            color: #333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="progress-bar" id="progressBar"></div>
        
        <div class="register-header">
            <h1><i class="fas fa-user-plus"></i> Create Account</h1>
            <p>Join our portfolio community with exclusive benefits</p>
        </div>

        <div id="alertContainer"></div>

        <!-- Account Type Selection -->
        <div class="account-types">
            <div class="account-type selected" data-type="individual">
                <span class="icon">👤</span>
                <div class="title">Individual</div>
                <div class="desc">Personal portfolio</div>
            </div>
            <div class="account-type" data-type="business">
                <span class="icon">🏢</span>
                <div class="title">Business</div>
                <div class="desc">Company profile</div>
            </div>
            <div class="account-type" data-type="student">
                <span class="icon">🎓</span>
                <div class="title">Student</div>
                <div class="desc">Academic profile</div>
            </div>
        </div>

        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john.doe@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+880 1234567890" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="profession">Profession</label>
                <select id="profession" required>
                    <option value="">Select your profession</option>
                    <option value="developer">Software Developer</option>
                    <option value="designer">UI/UX Designer</option>
                    <option value="engineer">Engineer</option>
                    <option value="student">Student</option>
                    <option value="freelancer">Freelancer</option>
                    <option value="entrepreneur">Entrepreneur</option>
                    <option value="consultant">Consultant</option>
                    <option value="manager">Manager</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group skills-section">
                <label>Skills & Expertise</label>
                <div class="skills-input">
                    <input type="text" id="skillInput" placeholder="Enter a skill (e.g., JavaScript, Photography)">
                    <button type="button" class="add-skill-btn" onclick="addSkill()">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div id="skillsList" class="skills-list"></div>
            </div>

            <button type="submit" class="register-btn">
                <i class="fas fa-user-plus"></i> Create My Account
            </button>
        </form>

        <div class="social-login">
            <a href="#" class="social-btn">
                <i class="fab fa-google" style="color: #4285f4;"></i>
                Continue with Google
            </a>
            <a href="#" class="social-btn">
                <i class="fab fa-facebook" style="color: #1877f2;"></i>
                Continue with Facebook
            </a>
        </div>

        <div class="divider">
            <span>Already have an account?</span>
        </div>

        <a href="user-login.html" class="login-link">
            <i class="fas fa-sign-in-alt"></i> Sign In to Your Account
        </a>
    </div>

    <script>
        let userSkills = [];
        let selectedAccountType = 'individual';

        // Progress bar update
        function updateProgress() {
            const form = document.getElementById('registerForm');
            const inputs = form.querySelectorAll('input[required], select[required]');
            let filled = 0;
            
            inputs.forEach(input => {
                if (input.value.trim()) filled++;
            });
            
            if (userSkills.length > 0) filled += 0.5;
            
            const progress = (filled / (inputs.length + 0.5)) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // Account type selection
        document.querySelectorAll('.account-type').forEach(type => {
            type.addEventListener('click', function() {
                document.querySelectorAll('.account-type').forEach(t => t.classList.remove('selected'));
                this.classList.add('selected');
                selectedAccountType = this.dataset.type;
            });
        });

        // Add skill function with animation
        function addSkill() {
            const skillInput = document.getElementById('skillInput');
            const skill = skillInput.value.trim();
            
            if (skill && !userSkills.includes(skill)) {
                userSkills.push(skill);
                updateSkillsList();
                skillInput.value = '';
                updateProgress();
                
                // Add shake animation to skill input
                skillInput.style.animation = 'none';
                setTimeout(() => {
                    skillInput.style.animation = 'skillInputSuccess 0.3s ease-out';
                }, 10);
            }
        }

        // Update skills list display with animations
        function updateSkillsList() {
            const skillsList = document.getElementById('skillsList');
            skillsList.innerHTML = userSkills.map((skill, index) => 
                `<div class="skill-tag" style="animation-delay: ${index * 0.1}s">
                    ${skill}
                    <span class="skill-remove" onclick="removeSkill('${skill}')">&times;</span>
                </div>`
            ).join('');
        }

        // Remove skill function
        function removeSkill(skill) {
            userSkills = userSkills.filter(s => s !== skill);
            updateSkillsList();
            updateProgress();
        }

        // Add skill on Enter key
        document.getElementById('skillInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSkill();
            }
        });

        // Update progress on input
        document.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('input', updateProgress);
        });

        // Show alert function with enhanced animation
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${message}`;
            
            alertContainer.appendChild(alert);
            setTimeout(() => alert.classList.add('show'), 100);
            
            setTimeout(() => {
                alert.classList.remove('show');
                setTimeout(() => alertContainer.removeChild(alert), 500);
            }, 4000);
        }

        // Form submission with enhanced validation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                accountType: selectedAccountType,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
                profession: document.getElementById('profession').value,
                skills: userSkills
            };

            // Enhanced validation
            if (formData.password !== formData.confirmPassword) {
                showAlert('Passwords do not match! Please check and try again.', 'error');
                return;
            }

            if (formData.password.length < 8) {
                showAlert('Password must be at least 8 characters long for security!', 'error');
                return;
            }

            if (userSkills.length === 0) {
                showAlert('Please add at least one skill to showcase your expertise!', 'error');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(formData.email)) {
                showAlert('Please enter a valid email address!', 'error');
                return;
            }

            // Save user data
            const users = JSON.parse(localStorage.getItem('portfolioUsers') || '[]');
            
            // Check if email already exists
            if (users.find(user => user.email === formData.email)) {
                showAlert('This email is already registered! Please use a different email or sign in.', 'error');
                return;
            }

            // Add new user with enhanced data
            const newUser = {
                id: Date.now(),
                ...formData,
                registeredAt: new Date().toISOString(),
                isActive: true,
                profileComplete: false,
                lastLogin: null
            };
            
            delete newUser.confirmPassword;
            users.push(newUser);
            localStorage.setItem('portfolioUsers', JSON.stringify(users));

            // Success animation
            document.getElementById('progressBar').style.width = '100%';
            showAlert(`🎉 Welcome ${formData.firstName}! Your account has been created successfully!`, 'success');
            
            // Redirect after success animation
            setTimeout(() => {
                window.location.href = 'user-login.html';
            }, 2500);
        });

        // Load existing users data for display
        window.addEventListener('load', function() {
            const users = JSON.parse(localStorage.getItem('portfolioUsers') || '[]');
            console.log(`Total registered users: ${users.length}`);
            
            // Initial progress update
            updateProgress();
        });

        // Add some interactive animations
        document.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>

    <style>
        @keyframes skillInputSuccess {
            0% { border-color: #e0e0e0; }
            50% { border-color: #28a745; }
            100% { border-color: #667eea; }
        }
        
        /* Loading animation for form submission */
        .register-btn.loading {
            position: relative;
            color: transparent;
        }
        
        .register-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>
