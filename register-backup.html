<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Create Account - Md. Imran Hossain</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/about-me.jpg">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    
    <!-- Custom Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, 
                #667eea 0%, 
                #764ba2 25%, 
                #f093fb 50%, 
                #f5576c 75%, 
                #4facfe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Animated Background Particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: float 8s infinite linear;
        }

        .particle:nth-child(1) { width: 6px; height: 6px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 8px; height: 8px; left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { width: 4px; height: 4px; left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { width: 7px; height: 7px; left: 40%; animation-delay: 3s; }
        .particle:nth-child(5) { width: 5px; height: 5px; left: 50%; animation-delay: 4s; }
        .particle:nth-child(6) { width: 9px; height: 9px; left: 60%; animation-delay: 5s; }
        .particle:nth-child(7) { width: 4px; height: 4px; left: 70%; animation-delay: 6s; }
        .particle:nth-child(8) { width: 6px; height: 6px; left: 80%; animation-delay: 7s; }
        .particle:nth-child(9) { width: 5px; height: 5px; left: 90%; animation-delay: 8s; }
        .particle:nth-child(10) { width: 8px; height: 8px; left: 25%; animation-delay: 9s; }
        .particle:nth-child(11) { width: 6px; height: 6px; left: 75%; animation-delay: 10s; }
        .particle:nth-child(12) { width: 7px; height: 7px; left: 65%; animation-delay: 11s; }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Registration Container */
        .register-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: containerSlideIn 0.8s ease-out;
        }

        @keyframes containerSlideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .register-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .register-header .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            margin: 0 auto 20px;
            display: block;
            object-fit: cover;
            animation: logoGlow 3s infinite alternate;
        }

        @keyframes logoGlow {
            from {
                box-shadow: 0 0 25px rgba(102, 126, 234, 0.5);
            }
            to {
                box-shadow: 0 0 40px rgba(118, 75, 162, 0.8);
            }
        }

        .register-header h2 {
            color: #fff;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 32px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .register-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
        }

        /* Form Styles */
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            flex: 1;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 16px 20px;
            padding-left: 55px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #667eea;
            box-shadow: 0 0 25px rgba(102, 126, 234, 0.4);
            outline: none;
            transform: translateY(-2px);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .form-control:focus + .form-icon {
            color: #667eea;
            transform: translateY(-50%) scale(1.1);
        }

        /* Select Dropdown */
        .form-select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 16px 20px;
            padding-left: 55px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            width: 100%;
            cursor: pointer;
        }

        .form-select:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #667eea;
            box-shadow: 0 0 25px rgba(102, 126, 234, 0.4);
            outline: none;
        }

        .form-select option {
            background: #2c2c54;
            color: #fff;
            padding: 10px;
        }

        /* Password Strength Indicator */
        .password-strength {
            margin-top: 5px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak { width: 25%; background: #ff6b6b; }
        .strength-medium { width: 50%; background: #ffd93d; }
        .strength-good { width: 75%; background: #6bcf7f; }
        .strength-strong { width: 100%; background: #51cf66; }

        /* Agreement Checkbox */
        .agreement-section {
            margin: 25px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .agreement-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .agreement-item:last-child {
            margin-bottom: 0;
        }

        .agreement-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .agreement-item a {
            color: #667eea;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .agreement-item a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Register Button */
        .register-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border: none;
            border-radius: 15px;
            padding: 18px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .register-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .register-btn:hover::before {
            left: 100%;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
        }

        .register-btn:active {
            transform: translateY(-1px);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .divider span {
            background: rgba(0, 0, 0, 0);
            color: rgba(255, 255, 255, 0.7);
            padding: 0 20px;
            font-size: 14px;
        }

        /* Social Register */
        .social-register {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 14px;
            color: #fff;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            color: #fff;
            text-decoration: none;
        }

        .social-btn i {
            margin-right: 8px;
            font-size: 16px;
        }

        .google { border-color: #db4437; }
        .google:hover { background: rgba(219, 68, 55, 0.3); }

        .facebook { border-color: #3b5998; }
        .facebook:hover { background: rgba(59, 89, 152, 0.3); }

        /* Login Link */
        .login-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            color: #fff;
            text-decoration: none;
        }

        /* Validation Messages */
        .validation-message {
            font-size: 12px;
            margin-top: 5px;
            padding: 5px 10px;
            border-radius: 8px;
            display: none;
        }

        .validation-success {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            border: 1px solid rgba(81, 207, 102, 0.3);
        }

        .validation-error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .register-container {
                margin: 20px;
                padding: 30px 25px;
                max-width: 400px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .back-btn {
                top: 20px;
                left: 20px;
                width: 50px;
                height: 50px;
            }
            
            .register-header h2 {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .form-control, .form-select {
                padding: 14px 18px;
                padding-left: 50px;
            }
            
            .social-register {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <!-- Back to Portfolio Button -->
    <a href="index.html" class="back-btn" title="Back to Portfolio">
        <i class="fas fa-arrow-left"></i>
    </a>

    <!-- Animated Background -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Registration Container -->
    <div class="register-container">
        <!-- Header -->
        <div class="register-header">
            <img src="images/about-me.jpg" alt="Profile" class="logo">
            <h2>Create Account</h2>
            <p>Join our community and start your journey</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm">
            <!-- Name Fields -->
            <div class="form-row">
                <div class="form-group">
                    <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
                    <i class="fas fa-user form-icon"></i>
                    <div class="validation-message" id="firstNameMsg"></div>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                    <i class="fas fa-user form-icon"></i>
                    <div class="validation-message" id="lastNameMsg"></div>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                <i class="fas fa-envelope form-icon"></i>
                <div class="validation-message" id="emailMsg"></div>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <input type="tel" class="form-control" id="phone" placeholder="Phone Number (+880XXXXXXXXX)" required>
                <i class="fas fa-phone form-icon"></i>
                <div class="validation-message" id="phoneMsg"></div>
            </div>

            <!-- Gender & Date of Birth -->
            <div class="form-row">
                <div class="form-group">
                    <select class="form-select" id="gender" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                    <i class="fas fa-venus-mars form-icon"></i>
                </div>
                <div class="form-group">
                    <input type="date" class="form-control" id="dateOfBirth" required>
                    <i class="fas fa-calendar form-icon"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <i class="fas fa-lock form-icon"></i>
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="validation-message" id="passwordMsg"></div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                <i class="fas fa-lock form-icon"></i>
                <div class="validation-message" id="confirmPasswordMsg"></div>
            </div>

            <!-- Account Type -->
            <div class="form-group">
                <select class="form-select" id="accountType" required>
                    <option value="" disabled selected>Account Type</option>
                    <option value="personal">Personal Account</option>
                    <option value="business">Business Account</option>
                    <option value="developer">Developer Account</option>
                    <option value="student">Student Account</option>
                </select>
                <i class="fas fa-user-tag form-icon"></i>
            </div>

            <!-- Professional Info (Optional) -->
            <div class="form-group">
                <input type="text" class="form-control" id="profession" placeholder="Profession (Optional)">
                <i class="fas fa-briefcase form-icon"></i>
            </div>

            <div class="form-group">
                <input type="text" class="form-control" id="company" placeholder="Company/Organization (Optional)">
                <i class="fas fa-building form-icon"></i>
            </div>

            <!-- Interests -->
            <div class="form-group">
                <select class="form-select" id="interests">
                    <option value="" disabled selected>Primary Interest</option>
                    <option value="web-development">Web Development</option>
                    <option value="mobile-development">Mobile Development</option>
                    <option value="data-science">Data Science</option>
                    <option value="ui-ux-design">UI/UX Design</option>
                    <option value="digital-marketing">Digital Marketing</option>
                    <option value="business">Business</option>
                    <option value="education">Education</option>
                    <option value="other">Other</option>
                </select>
                <i class="fas fa-heart form-icon"></i>
            </div>

            <!-- Agreement Section -->
            <div class="agreement-section">
                <div class="agreement-item">
                    <input type="checkbox" id="agreeTerms" required>
                    <span>I agree to the <a href="#" onclick="showTerms()">Terms & Conditions</a></span>
                </div>
                <div class="agreement-item">
                    <input type="checkbox" id="agreePrivacy" required>
                    <span>I agree to the <a href="#" onclick="showPrivacy()">Privacy Policy</a></span>
                </div>
                <div class="agreement-item">
                    <input type="checkbox" id="agreeNewsletter">
                    <span>Subscribe to newsletter for updates (Optional)</span>
                </div>
                <div class="agreement-item">
                    <input type="checkbox" id="agreeMarketing">
                    <span>Receive marketing communications (Optional)</span>
                </div>
            </div>

            <!-- Register Button -->
            <button type="submit" class="register-btn" id="registerButton">
                <i class="fas fa-user-plus" style="margin-right: 10px;"></i>
                Create My Account
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>or register with</span>
        </div>

        <!-- Social Register -->
        <div class="social-register">
            <a href="#" class="social-btn google" onclick="googleRegister()">
                <i class="fab fa-google"></i>Google
            </a>
            <a href="#" class="social-btn facebook" onclick="facebookRegister()">
                <i class="fab fa-facebook-f"></i>Facebook
            </a>
        </div>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    
    <script>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 199, 255, 0.3) 0%, transparent 50%);
            animation: backgroundMove 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, -20px) rotate(10deg); }
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.2),
                0 10px 30px rgba(102, 126, 234, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
            position: relative;
            animation: containerSlideUp 0.8s ease-out;
            transition: all 0.3s ease;
        }

        .register-container:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.25),
                0 15px 40px rgba(102, 126, 234, 0.2);
        }

        @keyframes containerSlideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            border-radius: 25px 25px 0 0;
            width: 0%;
        }

        .register-header {
            margin-bottom: 35px;
            position: relative;
        }

        .register-header::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .register-header h1 {
            color: #333;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            animation: titleFade 1s ease-out 0.3s both;
        }

        .register-header p {
            color: #666;
            font-size: 16px;
            animation: subtitleFade 1s ease-out 0.5s both;
        }

        @keyframes titleFade {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes subtitleFade {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Account Type Selection */
        .account-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .account-type {
            padding: 20px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;

    <script>
        let userSkills = [];
        let selectedAccountType = 'individual';

        // Progress bar update
        function updateProgress() {
            const form = document.getElementById('registerForm');
            const inputs = form.querySelectorAll('input[required], select[required]');
            let filled = 0;
            
            inputs.forEach(input => {
                if (input.value.trim()) filled++;
            });
            
            if (userSkills.length > 0) filled += 0.5;
            
            const progress = (filled / (inputs.length + 0.5)) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // Account type selection
        document.querySelectorAll('.account-type').forEach(type => {
            type.addEventListener('click', function() {
                document.querySelectorAll('.account-type').forEach(t => t.classList.remove('selected'));
                this.classList.add('selected');
                selectedAccountType = this.dataset.type;
            });
        });

        // Add skill function with animation
        function addSkill() {
            const skillInput = document.getElementById('skillInput');
            const skill = skillInput.value.trim();
            
            if (skill && !userSkills.includes(skill)) {
                userSkills.push(skill);
                updateSkillsList();
                skillInput.value = '';
                updateProgress();
                
                // Add shake animation to skill input
                skillInput.style.animation = 'none';
                setTimeout(() => {
                    skillInput.style.animation = 'skillInputSuccess 0.3s ease-out';
                }, 10);
            }
        }

        // Update skills list display with animations
        function updateSkillsList() {
            const skillsList = document.getElementById('skillsList');
            skillsList.innerHTML = userSkills.map((skill, index) => 
                `<div class="skill-tag" style="animation-delay: ${index * 0.1}s">
                    ${skill}
                    <span class="skill-remove" onclick="removeSkill('${skill}')">&times;</span>
                </div>`
            ).join('');
        }

        // Remove skill function
        function removeSkill(skill) {
            userSkills = userSkills.filter(s => s !== skill);
            updateSkillsList();
            updateProgress();
        }

        // Add skill on Enter key
        document.getElementById('skillInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSkill();
            }
        });

        // Update progress on input
        document.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('input', updateProgress);
        });

        // Show alert function with enhanced animation
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${message}`;
            
            alertContainer.appendChild(alert);
            setTimeout(() => alert.classList.add('show'), 100);
            
            setTimeout(() => {
                alert.classList.remove('show');
                setTimeout(() => alertContainer.removeChild(alert), 500);
            }, 4000);
        }

        // Form submission handled by newer system below
        // This section removed to avoid conflicts

        // Load existing users data for display
        window.addEventListener('load', function() {
            const users = JSON.parse(localStorage.getItem('portfolioUsers') || '[]');
            console.log(`Total registered users: ${users.length}`);
            
            // Initial progress update
            updateProgress();
        });

        // Add some interactive animations
        document.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>

    <!-- Scripts -->
    <script src="js/jquery.min.js"></script>

    <script>
        // Form Validation and Functionality
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (validateForm()) {
                submitForm();
            }
        });

        // Individual Validation Functions
        function validateEmail(email) {
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const msgElement = document.getElementById('emailMsg');
            
            if (!email) {
                showValidationMessage(msgElement, 'Email is required', 'error');
                return false;
            } else if (!emailPattern.test(email)) {
                showValidationMessage(msgElement, 'Please enter a valid email', 'error');
                return false;
            } else {
                showValidationMessage(msgElement, 'Email is valid', 'success');
                return true;
            }
        }

        function validatePhone(phone) {
            const phonePattern = /^\+880[0-9]{10}$/;
            const msgElement = document.getElementById('phoneMsg');
            
            if (!phone) {
                showValidationMessage(msgElement, 'Phone number is required', 'error');
                return false;
            } else if (!phonePattern.test(phone)) {
                showValidationMessage(msgElement, 'Format: +880XXXXXXXXX', 'error');
                return false;
            } else {
                showValidationMessage(msgElement, 'Phone number is valid', 'success');
                return true;
            }
        }

        function validateName(name, field) {
            const msgElement = document.getElementById(field + 'Msg');
            
            if (!name || name.length < 2) {
                showValidationMessage(msgElement, 'Name must be at least 2 characters', 'error');
                return false;
            } else if (!/^[a-zA-Z\s]+$/.test(name)) {
                showValidationMessage(msgElement, 'Name can only contain letters', 'error');
                return false;
            } else {
                showValidationMessage(msgElement, 'Name is valid', 'success');
                return true;
            }
        }

        function validatePassword(password) {
            const msgElement = document.getElementById('passwordMsg');
            
            if (!password) {
                showValidationMessage(msgElement, 'Password is required', 'error');
                return false;
            } else if (password.length < 8) {
                showValidationMessage(msgElement, 'Password must be at least 8 characters', 'error');
                return false;
            } else if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(password)) {
                showValidationMessage(msgElement, 'Password must contain uppercase, lowercase, and numbers', 'error');
                return false;
            } else {
                showValidationMessage(msgElement, 'Strong password!', 'success');
                return true;
            }
        }

        function validateConfirmPassword(confirmPassword) {
            const password = document.getElementById('password').value;
            const msgElement = document.getElementById('confirmPasswordMsg');
            
            if (!confirmPassword) {
                showValidationMessage(msgElement, 'Please confirm your password', 'error');
                return false;
            } else if (password !== confirmPassword) {
                showValidationMessage(msgElement, 'Passwords do not match', 'error');
                return false;
            } else {
                showValidationMessage(msgElement, 'Passwords match!', 'success');
                return true;
            }
        }

        // Password Strength Checker
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('strengthBar');
            let strength = 0;
            
            // Length check
            if (password.length >= 8) strength += 1;
            if (password.length >= 12) strength += 1;
            
            // Character variety checks
            if (/[a-z]/.test(password)) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 1;
            
            // Apply strength classes
            strengthBar.className = 'strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-medium');
            } else if (strength <= 4) {
                strengthBar.classList.add('strength-good');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        }

        // Validation Message Display
        function showValidationMessage(element, message, type) {
            element.textContent = message;
            element.className = `validation-message validation-${type}`;
            element.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    element.style.display = 'none';
                }, 3000);
            }
        }

        // Complete Form Validation
        function validateForm() {
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            const agreePrivacy = document.getElementById('agreePrivacy').checked;
            
            let isValid = true;
            
            // Validate all required fields
            isValid &= validateName(firstName, 'firstName');
            isValid &= validateName(lastName, 'lastName');
            isValid &= validateEmail(email);
            isValid &= validatePhone(phone);
            isValid &= validatePassword(password);
            isValid &= validateConfirmPassword(confirmPassword);
            
            // Check required selections
            if (!document.getElementById('gender').value) {
                showModal('Please select your gender', 'error');
                isValid = false;
            }
            
            if (!document.getElementById('dateOfBirth').value) {
                showModal('Please select your date of birth', 'error');
                isValid = false;
            }
            
            if (!document.getElementById('accountType').value) {
                showModal('Please select account type', 'error');
                isValid = false;
            }
            
            // Check agreements
            if (!agreeTerms) {
                showModal('Please agree to Terms & Conditions', 'error');
                isValid = false;
            }
            
            if (!agreePrivacy) {
                showModal('Please agree to Privacy Policy', 'error');
                isValid = false;
            }
            
            return isValid;
        }

        // Form Submission
        function submitForm() {
            const registerBtn = document.getElementById('registerButton');
            const originalText = registerBtn.innerHTML;
            
            // Show loading state
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            registerBtn.disabled = true;
            
            // Collect form data
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                gender: document.getElementById('gender').value,
                dateOfBirth: document.getElementById('dateOfBirth').value,
                password: document.getElementById('password').value,
                accountType: document.getElementById('accountType').value,
                profession: document.getElementById('profession').value,
                company: document.getElementById('company').value,
                interests: document.getElementById('interests').value,
                newsletter: document.getElementById('agreeNewsletter').checked,
                marketing: document.getElementById('agreeMarketing').checked,
                registrationDate: new Date().toISOString()
            };
            
            // Simulate account creation
            setTimeout(() => {
                // Save to portfolioUsers array for login authentication
                const users = JSON.parse(localStorage.getItem('portfolioUsers') || '[]');
                
                // Check if email already exists
                if (users.find(user => user.email === formData.email)) {
                    showModal('This email is already registered! Please use a different email.', 'error');
                    registerBtn.innerHTML = originalText;
                    registerBtn.disabled = false;
                    return;
                }
                
                // Add new user
                const newUser = {
                    id: Date.now(),
                    ...formData,
                    userType: 'regular_user',
                    isAdmin: false,
                    registeredAt: new Date().toISOString(),
                    isActive: true
                };
                
                delete newUser.confirmPassword; // Remove confirm password
                users.push(newUser);
                localStorage.setItem('portfolioUsers', JSON.stringify(users));
                
                // Save user data to pendingUser for profile
                localStorage.setItem('pendingUser', JSON.stringify(formData));
                localStorage.setItem('userRegistered', 'true');
                
                showModal(
                    'Account created successfully!\\nWelcome to our community!', 
                    'success', 
                    () => {
                        // Redirect to login page instead of auto-login
                        window.location.href = 'login.html';
                    }
                );
            }, 2500);
        }

        // Modal Display Function
        function showModal(message, type, callback) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.9);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 20px;
                padding: 40px;
                z-index: 10000;
                text-align: center;
                color: white;
                min-width: 350px;
                animation: modalSlideIn 0.4s ease-out;
                font-family: 'Poppins', sans-serif;
            `;
            
            const iconClass = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            const iconColor = type === 'success' ? '#6bcf7f' : '#ff6b6b';
            
            modal.innerHTML = `
                <i class="${iconClass}" style="font-size: 3rem; color: ${iconColor}; margin-bottom: 20px;"></i>
                <h3 style="margin-bottom: 15px; color: ${iconColor};">${type === 'success' ? 'Success!' : 'Oops!'}</h3>
                <p style="margin: 0; font-size: 16px; line-height: 1.5;">${message.replace(/\\n/g, '<br>')}</p>
                ${type === 'success' ? '<div style="margin-top: 20px;"><div class="spinner" style="margin: 0 auto; width: 30px; height: 30px; border: 3px solid rgba(108, 207, 127, 0.3); border-top: 3px solid #6bcf7f; border-radius: 50%; animation: spin 1s linear infinite;"></div><p style="margin-top: 10px; font-size: 14px; opacity: 0.8;">Redirecting to portfolio...</p></div>' : ''}
            `;
            
            document.body.appendChild(modal);
            
            setTimeout(() => {
                if (modal && modal.parentNode) {
                    modal.remove();
                }
                if (callback) callback();
            }, type === 'success' ? 3000 : 4000);
        }

        // Social Registration Functions
        function googleRegister() {
            showModal('Google registration coming soon!\\nPlease use the form above for now.', 'info');
        }

        function facebookRegister() {
            showModal('Facebook registration coming soon!\\nPlease use the form above for now.', 'info');
        }

        // Terms and Privacy Functions
        function showTerms() {
            showModal('Terms & Conditions:\\n\\n• Respect other users\\n• No spam or inappropriate content\\n• Keep your account secure\\n• Report any issues to support\\n• Use the platform responsibly', 'info');
        }

        function showPrivacy() {
            showModal('Privacy Policy:\\n\\n• Your data is secure and encrypted\\n• We never share personal information\\n• Cookies used for better experience\\n• You can delete your account anytime\\n• Contact us for data concerns', 'info');
        }

        // Add CSS for animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes modalSlideIn {
                from {
                    opacity: 0;
                    transform: translate(-50%, -60%) scale(0.9);
                }
                to {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
            }
            
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);

        // Initialize validation when page loads
        document.addEventListener('DOMContentLoaded', function() {
            setupRealTimeValidation();
            
            // Set max date for date of birth (must be at least 13 years old)
            const today = new Date();
            const maxDate = new Date(today.getFullYear() - 13, today.getMonth(), today.getDate());
            document.getElementById('dateOfBirth').max = maxDate.toISOString().split('T')[0];
        });
    </script>
</body>
</html>
