<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - Md. Imran Hossain</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/about-me.jpg">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    
    <!-- Custom Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, 
                #1a1a2e 0%, 
                #16213e 25%, 
                #0f3460 50%, 
                #533483 75%, 
                #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Particles */
        .bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s infinite linear;
        }

        .particle:nth-child(1) { width: 4px; height: 4px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 6px; height: 6px; left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { width: 3px; height: 3px; left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { width: 5px; height: 5px; left: 40%; animation-delay: 3s; }
        .particle:nth-child(5) { width: 4px; height: 4px; left: 50%; animation-delay: 4s; }
        .particle:nth-child(6) { width: 7px; height: 7px; left: 60%; animation-delay: 5s; }
        .particle:nth-child(7) { width: 3px; height: 3px; left: 70%; animation-delay: 6s; }
        .particle:nth-child(8) { width: 5px; height: 5px; left: 80%; animation-delay: 7s; }
        .particle:nth-child(9) { width: 4px; height: 4px; left: 90%; animation-delay: 8s; }
        .particle:nth-child(10) { width: 6px; height: 6px; left: 25%; animation-delay: 9s; }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: containerSlideIn 0.8s ease-out;
        }

        @keyframes containerSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            margin: 0 auto 20px;
            display: block;
            object-fit: cover;
            animation: logoGlow 2s infinite alternate;
        }

        @keyframes logoGlow {
            from {
                box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            }
            to {
                box-shadow: 0 0 30px rgba(102, 126, 234, 0.8);
            }
        }

        .login-header h2 {
            color: #fff;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px 20px;
            padding-left: 50px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .form-control:focus + .form-icon {
            color: #667eea;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            padding: 15px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Remember Me & Forgot Password */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
        }

        .remember-me input {
            margin-right: 8px;
            cursor: pointer;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .divider span {
            background: rgba(0, 0, 0, 0);
            color: rgba(255, 255, 255, 0.6);
            padding: 0 15px;
            font-size: 14px;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 12px;
            color: #fff;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            color: #fff;
            text-decoration: none;
        }

        .social-btn i {
            margin-right: 8px;
            font-size: 16px;
        }

        .google { border-color: #db4437; }
        .google:hover { background: rgba(219, 68, 55, 0.2); }

        .facebook { border-color: #3b5998; }
        .facebook:hover { background: rgba(59, 89, 152, 0.2); }

        /* Sign Up Link */
        .signup-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
            color: #fff;
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-container {
                margin: 20px;
                padding: 30px 25px;
            }
            
            .back-btn {
                top: 20px;
                left: 20px;
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>

<body>
    <!-- Back to Portfolio Button -->
    <a href="index.html" class="back-btn" title="Back to Portfolio">
        <i class="fas fa-arrow-left"></i>
    </a>

    <!-- Animated Background -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <img src="images/about-me.jpg" alt="Profile" class="logo">
            <h2>Welcome Back!</h2>
            <p>Sign in to access your account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                <i class="fas fa-envelope form-icon"></i>
            </div>

            <div class="form-group">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <i class="fas fa-lock form-icon"></i>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>
                <a href="#" class="forgot-password" onclick="forgotPassword()">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>or continue with</span>
        </div>

        <!-- Social Login -->
        <div class="social-login">
            <a href="#" class="social-btn google" onclick="googleLogin()">
                <i class="fab fa-google"></i>Google
            </a>
            <a href="#" class="social-btn facebook" onclick="facebookLogin()">
                <i class="fab fa-facebook-f"></i>Facebook
            </a>
        </div>

        <!-- Sign Up Link -->
        <div class="signup-link">
            Don't have an account? <a href="register.html">Sign up here</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    
    <script>
        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // Show loading state
            const loginBtn = document.querySelector('.login-btn');
            const originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            loginBtn.disabled = true;
            
            // Simulate login process
            setTimeout(() => {
                if (validateLogin(email, password)) {
                    // Successful login
                    showSuccess('Login successful! Redirecting...', () => {
                        if (rememberMe) {
                            localStorage.setItem('userEmail', email);
                        }
                        localStorage.setItem('userLoggedIn', 'true');
                        window.location.href = 'index.html';
                    });
                } else {
                    // Login failed
                    showError('Invalid email or password. Please try again.');
                    loginBtn.innerHTML = originalText;
                    loginBtn.disabled = false;
                }
            }, 1500);
        });
        
        function validateLogin(email, password) {
            // Check registered users from registration
            const registeredUsers = JSON.parse(localStorage.getItem('portfolioUsers') || '[]');
            const registeredUser = registeredUsers.find(user => user.email === email && user.password === password);
            
            if (registeredUser) {
                // Store user info for profile
                localStorage.setItem('userName', `${registeredUser.firstName} ${registeredUser.lastName}`);
                localStorage.setItem('userEmail', registeredUser.email);
                
                // Save detailed user data for profile
                const userData = {
                    firstName: registeredUser.firstName,
                    lastName: registeredUser.lastName,
                    email: registeredUser.email,
                    phone: registeredUser.phone,
                    profession: registeredUser.profession,
                    skills: registeredUser.skills || [],
                    accountType: registeredUser.accountType,
                    registrationDate: registeredUser.registeredAt
                };
                localStorage.setItem('pendingUser', JSON.stringify(userData));
                
                return true;
            }
            
            // Fallback to test users for demo
            const validUsers = [
                { email: 'demo@test.com', password: 'test123', name: 'Demo User' },
                { email: 'admin@mdimranhossainn.me', password: 'admin123', name: 'Admin User' },
                { email: 'user@example.com', password: 'user123', name: 'Example User' }
            ];
            
            const testUser = validUsers.find(user => user.email === email && user.password === password);
            if (testUser) {
                localStorage.setItem('userName', testUser.name);
                localStorage.setItem('userEmail', testUser.email);
                
                // Create demo user data
                const userData = {
                    firstName: testUser.name.split(' ')[0],
                    lastName: testUser.name.split(' ')[1] || '',
                    email: testUser.email,
                    phone: '+880 1234567890',
                    profession: 'Demo Professional',
                    accountType: 'individual',
                    registrationDate: new Date().toISOString()
                };
                localStorage.setItem('pendingUser', JSON.stringify(userData));
                
                return true;
            }
            
            return false;
        }
        
        function showSuccess(message, callback) {
            const modal = createModal(message, 'success', 'fas fa-check-circle', '#6bcf7f');
            document.body.appendChild(modal);
            
            setTimeout(() => {
                modal.remove();
                if (callback) callback();
            }, 2000);
        }
        
        function showError(message) {
            const modal = createModal(message, 'error', 'fas fa-exclamation-circle', '#ff6b6b');
            document.body.appendChild(modal);
            
            setTimeout(() => {
                modal.remove();
            }, 3000);
        }
        
        function createModal(message, type, icon, color) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.9);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 20px;
                padding: 30px;
                z-index: 10000;
                text-align: center;
                color: white;
                min-width: 300px;
                animation: modalSlideIn 0.3s ease-out;
            `;
            
            modal.innerHTML = `
                <i class="${icon}" style="font-size: 3rem; color: ${color}; margin-bottom: 15px;"></i>
                <p style="margin: 0; font-size: 16px;">${message}</p>
            `;
            
            return modal;
        }
        
        // Forgot Password
        function forgotPassword() {
            const email = prompt('Enter your email address:');
            if (email && email.includes('@')) {
                showSuccess('Password reset link sent to your email!');
            } else if (email) {
                showError('Please enter a valid email address.');
            }
        }
        
        // Social Login Functions
        function googleLogin() {
            showSuccess('Google login successful! Redirecting...', () => {
                localStorage.setItem('userLoggedIn', 'true');
                localStorage.setItem('loginMethod', 'google');
                window.location.href = 'index.html';
            });
        }
        
        function facebookLogin() {
            showSuccess('Facebook login successful! Redirecting...', () => {
                localStorage.setItem('userLoggedIn', 'true');
                localStorage.setItem('loginMethod', 'facebook');
                window.location.href = 'index.html';
            });
        }
        
        // Modal Animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes modalSlideIn {
                from {
                    opacity: 0;
                    transform: translate(-50%, -60%) scale(0.9);
                }
                to {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
            }
        `;
        document.head.appendChild(style);
        
        // Auto-fill remembered user
        window.addEventListener('DOMContentLoaded', function() {
            const rememberedEmail = localStorage.getItem('userEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
